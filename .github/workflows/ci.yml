name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build + type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Type check (tsc)
        run: npx tsc --noEmit
      - name: Build Next.js
        run: npx next build
        env:
          # Variables minimales pour permettre le build sans secrets
          ADMIN_PASSWORD: ci_dummy_password_min_32_chars_xxxx
          SESSION_SECRET: ci_dummy_session_secret_min_32_chars_xxx

  e2e:
    name: E2E Playwright (prod)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run smoke tests against production
        run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: https://chauffage-artisanal.vercel.app
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
